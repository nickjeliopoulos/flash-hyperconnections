[build-system]
requires = ["setuptools>=68", "wheel", "torch>=2.14.1", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-hypercons"
version = "0.1.0"
description = "CUDA matrix exponentials and projected stream mixing for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.14.1"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy", "scipy"]
dev = ["ruff", "build"]
benchmark = ["numpy", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["flash_hypercons*"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires an NVIDIA CUDA device", "compile: exercises torch.compile"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
